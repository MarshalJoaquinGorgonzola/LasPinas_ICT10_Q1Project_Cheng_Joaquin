<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css"/>
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

  <script type="py" src="./main.py"></script>

  <link rel="stylesheet" href="style.css">

</head>
<body>
   
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">

     </script>

    <header class="title-card">
    <div class="title-logo">
        <h1 style="text-align-last: center;">SKU Generator</h1>
    </div>
    <a href="index.html" style="color: white; text-decoration: none;">
    <b>RECEIPT</b>
    </a>
    </header>

    <div class="container">
        <h1 style="text-align:center"> Generate Your SKU </h1>
        <br>
        <label for="category">Category</label>
        <select id="category" class="form-select">
        <option value="none">None</option>
        <option value="perishables">Perishables</option>
        <option value="nonperish">Non-perishables</option>
        <option value="frozen">Equipment</option>
        </select>
        <br>
        <label for="product_name"> Product Name </label>
        <input name="product_name" id="product_name" type="text" placeholder="Taho"></input>
        <br> <br>
        <label for="quantity">Quantity</label>
        <br>
        <input name="quantity" id="quantity" type="number" placeholder="E.G: 50"></input>
        <br> <br>
        <button type="button" py-click="SKU_generator" class="button" style="text-align: center;"> Generate SKU </button>
        <div id="sku_output"></div>
    </div>

</body>
</html>
