<!DOCTYPE html>
<html lang="en">

<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css"/>
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

  <script type="py" src="./main.py"></script>

    <meta charset="UTF-8">
    <title>Coffee Shop Receipt Generator</title>

</head>

<body>

    <style>
   
   
    body {
       
        background-image: url("coffee.png");  
        background-size: cover; 
        background-position: center center; 
        background-repeat: no-repeat;  
        background-attachment: fixed; 
        min-height: 100vh; 
               }     
    .container { 
            width: 300px;  
            height: 475px; 
            background-color: #ffffff;     
            border-style: solid;
            border-color: #a38558; 
            border-width: 5px;
            padding: 10px;            
            margin: 15px auto;              
            box-sizing: border-box;  
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); 
        }
    .button {
            background-color: #5c4b32; 
            color: #ffffff;            
            padding: 12px 24px;                     
            border-radius: 4px;                   
            font-size: 16px;           
        }
    .title-card {
  
        display: flex;
        align-items: center; 
        background-color: #715a37; 
        justify-content: space-between;
        color: #ffffff;
        padding: 10px 20px;
        height: 80px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);

}
    
    </style>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

   <header class="title-card">
    <div class="title-logo">
        <h1 style="text-align-last: center;">OBMC Coffee Shop</h1>
        <p>Receipt Generator</p>
    </div>
    <div>
    <a href="sku.html" style="color: white; text-decoration: none;">
    <b>SKU</b>
    </a>
    </div>
    </header>

    <div class="container">
        <h2 style="text-align: center;">Menu</h2>
        <form id="orderForm" style="text-align: center;">

            <input type="checkbox" id="americano" value="120">
            <label for="americano">Americano (₱120)</label>
            <br>

            <input type="checkbox" id="latte" value="140">
            <label for="latte">Spanish Latte (₱140)</label>
            <br>

            <input type="checkbox" id="malt" value="160">
            <label for="malt">Cold Brew Malt (₱160)</label>
            <br>

            <input type="checkbox" id="affogato" value="150">
            <label for="affogato">Affogato (₱150)</label>
            <br>
            <input type="checkbox" id="caramel" value="145">
            <label for="caramel">Caramel Macchiato (₱145)</label>
            <br>
            <input type="checkbox" id="papoi" value="10000">
            <label for="papoi"> Sacred Papoi (₱10,000)</label>
            <br><br>

        
            <button type="button" onclick="createOrder()" py-click="create_order" class="button"> Generate Official Receipt </button>
        </form>

        <div id="show" style="text-align: center;"></div>

    </div>
    
</body>
</html>
